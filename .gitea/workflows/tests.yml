name: PR checks

# The pull-request half of the pair: the same test suite, image build and smoke gate as
# image-check-publish.yml, after which the image is thrown away. No registry login, no push.
# The image is real because most of what the gate checks (curl present, credentials file kept out by
# .dockerignore, the server starts with no PVE and answers DNS) needs an artefact.
on:
  # Manual dispatch is safe: this file holds no credential and never pushes.
  workflow_dispatch:
  pull_request:

permissions:
  contents: read   # checkout

# Cancelling is on here, unlike the publishing workflow: a superseded PR check produces nothing
# anyone consumes, while cancelling there would destroy a :<sha> rollback image.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # `ubuntu-latest` is the label the instance-level runner advertises, not a machine name.
    runs-on: ubuntu-latest
    # Must exceed the 15-minute step: when the job timeout fires, act_runner kills the job and the
    # `if: always()` cleanup is not guaranteed to run.
    timeout-minutes: 25
    # Job-level so the steps that create and remove the test container agree on its name. Same
    # expression as the build job; the run id keeps concurrent runs on the shared daemon apart,
    # including this check running alongside the publishing workflow.
    env:
      SMOKE_NAME: proxmox_dns-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history and tags; kept identical to image-check-publish.yml so the two checkouts match.
        fetch-depth: 0
    - name: Run the test suite
      # Runs before the build so a red suite does not spend time on an image nobody pushes.
      #
      # No `actions/setup-python`: setup actions are not verified on this self-hosted runner. Running
      # the suite inside `python:3.11-slim` (the application image's base) makes the interpreter an
      # explicit, versioned input.
      #
      # The work tree goes in as a tar on stdin, not a bind mount: this job runs inside act_runner's
      # container while `docker` drives a daemon outside it, so `-v $(pwd):/w` would mount an empty
      # directory and pytest would collect nothing.
      #
      # 15 minutes: pip installs the dependencies from a cold cache on every run.
      timeout-minutes: 15
      run: |
        # `pipefail` so a `tar` that dies mid-stream is not masked by the docker exit status.
        set -e
        set -o pipefail
        # A re-run reuses the run id, and an attempt killed by the step timeout may have left the
        # container behind.
        docker rm -f "$SMOKE_NAME-tests" || true
        # Excluded: .git (history), .venv (host-built packages would shadow the container's), data/
        # (local runtime state when run by hand on a workstation), __pycache__ (foreign bytecode).
        # --pull always: the self-hosted daemon is persistent, so a cached python:3.11-slim would
        # otherwise serve every run for months.
        # PROXMOX_HOSTS is a placeholder that reaches no network: src/settings.py requires it at
        # collection time. It overrides tests/conftest.py's setdefault and must keep TWO entries:
        # the suite asserts that more than one host is configured, since with a single host a state
        # built from all hosts is indistinguishable from one built from the first.
        tar --exclude=./.git --exclude=./.venv --exclude=./data --exclude=__pycache__ -cf - . \
          | docker run --rm -i --pull always --name "$SMOKE_NAME-tests" -w /w \
              -e PROXMOX_HOSTS='[{"host": "test-host-1", "user": "test@pve", "token_name": "dns", "token_value": "test-token-1"}, {"host": "test-host-2", "user": "test@pve", "token_name": "dns", "token_value": "test-token-2"}]' \
              python:3.11-slim bash -c '
          set -e
          tar -xf -
          pip install --no-cache-dir -r requirements-dev.txt
          pytest --tb=short -q
        '
    - name: Remove the test container from the runner
      # When the step timeout fires it kills the docker client, not the container, so `--rm` never
      # runs and the container has to be removed by name from the shared daemon. A no-op on a green
      # run. `|| true` so cleanup cannot hide the suite's verdict.
      if: always()
      run: |
        docker rm -f "$SMOKE_NAME-tests" || true

  build:
    runs-on: ubuntu-latest
    # Red tests -> no image. Kept identical to the publishing workflow.
    needs: test
    # Step timeouts sum to 35 minutes (20 build + 15 smoke); the job bound must exceed that, or
    # act_runner kills the job before the `if: always()` cleanup steps run.
    timeout-minutes: 50
    # Job-level so the smoke step (ci/smoke.py names its containers after it) and the cleanup step
    # agree on it. ci/smoke.py refuses to start without it.
    env:
      SMOKE_NAME: proxmox_dns-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7
      # Each job gets its own workspace, so the tree is fetched again here.
      with:
        fetch-depth: 0
    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (production follows :latest); any other branch -> :<branch>.
      # The `main` check below, the `branches:` filter at the top and the `pull_request` filter in
      # tests.yml must all name the real default branch; a mismatch does not fail loudly.
      #
      # On a pull request `github.ref_name` is the merge ref (`123/merge`), so this always takes the
      # else branch. The body is kept byte-identical to image-check-publish.yml, `main` branch and all.
      env:
        # Through the environment, not interpolated into the script: branch names may contain `$`,
        # backticks and parentheses, which would execute on the shared self-hosted runner.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Docker rejects uppercase in image paths, Gitea allows it in repo names. On this instance
        # $REPO resolves to projects/proxmox_dns; the `image:` line in docker-compose.yml is the one
        # hand-written copy of this path.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Order matters: the push step pushes left to right, so :latest goes last and a failed
          # :<sha> push stops the run before production's tag moves.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate uses :<sha>, the one tag that can only mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Legal docker tag: [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}. Other characters become `-`, a bad
          # first character becomes `_`, and the result is cut to 100 chars.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch named `latest` would otherwise produce the production tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi
    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one act_runner is known to enforce; the job-level one is
      # only the outer bound.
      timeout-minutes: 20
      env:
        # `$TAGS` is left unquoted below: it is a space-separated list that word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        set -e
        # Count the split words, not the raw string: a whitespace-only value would pass
        # `[ -n "$TAGS" ]` and build an untagged image.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to build: the tag-computation step produced no usable output. Refusing to build an image that nothing could name, push or remove." >&2; exit 1; }
        tag_args=""
        for tag in "$@"; do tag_args="$tag_args --tag $tag"; done
        # --pull: the self-hosted daemon is persistent, so a cached base image would never be
        # refreshed. This is a BuildKit build (the default since Engine 23.0), whose cache the
        # cleanup step at the end cannot reclaim.
        docker build --pull . --file Dockerfile $tag_args
    - name: Smoke-test the built image
      # The gate: between build and push, so a red smoke means nothing reaches the registry. It is
      # the only check of the artefact itself (curl present, credentials file kept out by
      # .dockerignore, the server starts and answers DNS).
      #
      # Read the module docstring in ci/smoke.py before changing the checks: the gate boots the image
      # with PVE hosts at unroutable addresses on purpose (an unreachable PVE must not stop the
      # servers from binding), and no port is published (this job's loopback is not the daemon's;
      # everything internal goes through `docker exec`).
      #
      # The runner's job image has `python3` but no bare `python`; inside the container it is the
      # other way round, and ci/smoke.py accounts for that.
      #
      # 15 minutes against ci/smoke.py's worst case of roughly 13 if every docker call runs out its
      # bound; the gate normally takes under a minute. If this timeout kills the script, its own
      # cleanup does not run and the `if: always()` step below handles it.
      timeout-minutes: 15
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The body is byte-identical to the one in image-check-publish.yml; only the `env:` value differs.
      run: |
        python3 ci/smoke.py
    - name: Remove the smoke containers from the runner
      # ci/smoke.py removes its own containers, so this is normally a no-op. It covers a step killed
      # by its timeout: that kills the docker client, not the container, so a hung `--rm` container
      # survives and would also pin the image for `docker rmi` below.
      # The test-suite container belongs to the test job, which removes it itself.
      if: always()
      run: |
        # -guard is the one-shot run with no configuration; -serve runs the image's real command.
        # Kept in step with ALL_SUFFIXES in ci/smoke.py. Best effort: never fails the step.
        for suffix in -guard -serve; do docker rm -f "$SMOKE_NAME$suffix" || true; done
    - name: Remove the built images from the runner
      # Removes only this run's tags; no `docker system prune`, which would hit other repos sharing
      # the daemon. The BuildKit cache (`docker builder prune`) and base images left dangling by
      # `--pull` need a separate periodic cleanup on the runner host.
      if: always()
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS is fine here: if tag computation produced nothing, nothing was built.
        for tag in $TAGS; do docker rmi "$tag" || true; done
