# EXAMPLE compose: shows which variables, ports and labels the service needs. It is not kept in
# sync with the running deployment (a Portainer stack), which is the source of truth; do not
# reconcile the two in either direction.
#
# Placeholders only, comments included: `XXX` for secrets, `example.com`/`example.lc` for names,
# RFC 5737 addresses for IPs. Some of these repositories are public. The one real value is the
# registry host in the image path.
#
# Deploy from a prebuilt image; a `build:` here, where present, is for running locally.
#
# The repository, service, container, Portainer stack and image are all named proxmox_dns.
#
# UDP :53 is mapped directly on the host (DNS cannot go through Traefik); the HTTP status page is
# on :8076 and through Traefik. Stateless: no data volume.
#
# Recreating this container briefly takes down resolution of the whole internal `example.lc` zone,
# for which it is authoritative, until the new container binds :53.

services:
  proxmox_dns:
    image: gitea.vvzvlad.xyz/projects/proxmox_dns:latest
    container_name: proxmox_dns
    # `always`, not `unless-stopped`: the zone must resolve again after a host or daemon restart
    # without anyone starting it; a deliberate `docker stop` holds only until the daemon restarts.
    restart: always
    # Longer than docker's 10 s default. Under PEP 475 a SIGTERM handler runs but the interrupted
    # syscall resumes, so a request already out at a black-holing PVE host (5 s timeout per
    # guest-agent call) has to finish before the process exits. src/app.py otherwise answers a stop
    # within milliseconds; 45 s is a ceiling that turns the remaining case into a clean exit.
    stop_grace_period: 45s
    security_opt:
      # Forbids privilege escalation through setuid binaries. Compatible with the gosu drop in
      # /entrypoint.sh, which only gives privileges up, and also covers the serving process.
      - no-new-privileges:true
    # No `cap_add: [NET_BIND_SERVICE]`: docker sets net.ipv4.ip_unprivileged_port_start=0 inside
    # the container, so uid 1000 binds 53 and 80 with an empty capability set (Docker 27.1.1):
    #   docker run --rm --user 1000 --security-opt no-new-privileges --cap-drop ALL python:3.11-slim
    #   BIND OK   53/udp uid=1000
    #   BIND OK   80/tcp uid=1000
    ports:
      # DNS is served over UDP only (the server binds a UDP socket).
      - "53:53/udp"
      - "8076:80/tcp"        # HTTP status page: /, /json, /health
    environment:
      # One entry per independent PVE host; a cluster is a single entry, since one endpoint answers
      # for every node. API tokens only. No default in code: a missing or empty variable fails at
      # startup with a message naming it. Create each token with `make pve-setup` (README.md); one
      # without its own ACL sees no guests.
      # A YAML block scalar for readability; the container sees one string.
      PROXMOX_HOSTS: >-
        [{"host": "pve1.example.lc", "user": "proxmoxdns@pve", "token_name": "dns", "token_value": "XXX"},
        {"host": "pve2.example.lc", "user": "proxmoxdns@pve", "token_name": "dns", "token_value": "XXX"}]
      LOG_LEVEL: WARNING
      SUBDOMAINS: "true"
      # Log timestamps in local time.
      TZ: Europe/Moscow
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      traefik.enable: "true"
      # The DNS name (`oldname.example.lc` as a placeholder) is an external name and is not renamed
      # to proxmox_dns.
      traefik.http.routers.proxmox_dns.rule: Host(`oldname.example.lc`)
      traefik.http.services.proxmox_dns.loadBalancer.server.port: 80
      traefik.http.routers.proxmox_dns.entrypoints: websecure
      # Quoted: an unquoted `true` is a YAML boolean some parsers hand to Traefik as `True`.
      # No `tls.certresolver`: no public CA issues certificates for the internal zone, so Traefik
      # serves its default certificate.
      traefik.http.routers.proxmox_dns.tls: "true"
      io.portainer.update.enable: "true"   # auto-update the image
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      # Keep the timings short: the first probe runs one `interval` after start, and the Portainer
      # image updater rolls the image back if it does not see `healthy` within 120 s.
      interval: 30s
      timeout: 2s
      retries: 2
      start_period: 5s
